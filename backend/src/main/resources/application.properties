# Server Configuration
server.port=8080

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vehicle_rental_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization - schema.sql is the source of truth, do not auto-execute
spring.sql.init.mode=never

# JWT Configuration
# No fallback secret: the application refuses to start unless a secret
# is supplied via the JWT_SECRET environment variable (minimum 32 bytes
# for HS256). See README.md for local setup.
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Admin Bootstrap Configuration
admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
admin.bootstrap.email=${ADMIN_EMAIL:}
admin.bootstrap.password=${ADMIN_PASSWORD:}
admin.bootstrap.phone=${ADMIN_PHONE:}
admin.bootstrap.name=${ADMIN_NAME:}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5176}

# Razorpay Configuration (secrets via environment variables only)
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.vehicle.rental=DEBUG
